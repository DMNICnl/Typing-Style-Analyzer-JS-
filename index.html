<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="stats">
        <h3 id="wpm">WPM: 0</h3>
        <h3 id="accuracy">Accuracy: 0</h3>
        <h3 id="errors">Error: 0</h3>
        <h3 id="backspaces">Backspaces: 0</h3>
        <h3 id="pauseAvg">PauseAvg: 0</h3>
      </div>
      <div class="container">
        <div class="container-items">
          <h1>Typing Style Analyzer</h1>
          <textarea name="text" id="typingArea"></textarea>
          <div class="buttons">
            <button id="startBtn">Start</button>
            <button id="resetBtn">Reset</button>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
